[project]
name = "lighton"
version = "0.1.0"
description = "LightOn Python SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.26.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pre-commit",
    "datamodel-code-generator",
    "pytest>=9.1.1",
]

[tool.uv]
# Supply-chain quarantine: ignore any distribution uploaded in the last 3 days,
# so freshly-published (possibly compromised) versions aren't picked up until vetted.
# Rolling window — each `uv lock` advances the cutoff.
exclude-newer = "3 days ago"

[tool.pytest.ini_options]
# Import the source tree directly, independent of the editable-install finder.
pythonpath = ["."]

[tool.ty.src]
# Generated code — validated by pydantic at runtime; call sites are still type-checked.
exclude = ["lighton/types/api/**"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lighton*"]
