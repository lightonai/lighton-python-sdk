[project]
name = "lighton"
version = "0.1.0"
description = "LightOn Python SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx", "pydantic>=2"]

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pre-commit",
    "datamodel-code-generator",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Import the source tree directly, independent of the editable-install finder.
pythonpath = ["."]

[tool.ty.src]
# Generated code — validated by pydantic at runtime; call sites are still type-checked.
exclude = ["lighton/types/api/**"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lighton*"]
