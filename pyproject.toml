[project]
name = "lighton"
version = "0.1.0"
description = "LightOn Python SDK"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx", "pydantic>=2"]

[dependency-groups]
dev = ["ruff", "ty", "pre-commit"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lighton*"]
