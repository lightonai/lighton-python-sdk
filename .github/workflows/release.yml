name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history + tags for the changelog

      - uses: astral-sh/setup-uv@v7

      - name: Check tag matches package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(uv version --short)
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag != project version $pkg — use 'make release VERSION=$tag'"
            exit 1
          fi

      - run: uv build   # -> dist/*.whl + *.tar.gz

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          args: --latest --strip header

      - name: Assemble release notes
        run: |
          # Annotated-tag message (from `make release DESC=...`) goes above the changelog.
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
            printf '\n' >> notes.md
          fi
          cat "${{ steps.cliff.outputs.changelog }}" >> notes.md

      - name: Publish to PyPI
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_PUBLISH_TOKEN }}
        run: uv publish

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME"
          --notes-file notes.md

      - name: Announce on Slack
        env:
          WEBHOOK: ${{ secrets.RELEASE_SLACK_WEBHOOK_URL }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::RELEASE_SLACK_WEBHOOK_URL is not set, skipping the announcement"
            exit 0
          fi
          # Escape Slack's entities first (& < > are markup to it, so an unescaped
          # "<SDK>" in a commit message would vanish), then markdown -> mrkdwn,
          # which renders neither "### x" nor "**bold**". Truncated well under
          # Slack's 40k text limit; the link carries the full notes either way.
          body=$(sed -e 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' notes.md \
               | sed -E 's/^#+ +(.*)$/*\1*/; s/\*\*([^*]+)\*\*/*\1*/g' \
               | head -c 3500)
          jq -n --arg tag "$GITHUB_REF_NAME" --arg url "$RELEASE_URL" \
                --arg repo "$GITHUB_REPOSITORY" --arg body "$body" \
             '{text: ("*\($repo) \($tag)* released\n<\($url)|Release notes> · `uv add lighton-sdk`\n\n\($body)")}' \
             > slack.json
          curl -sS --fail-with-body -X POST -H 'Content-Type: application/json' \
               --data @slack.json "$WEBHOOK"
